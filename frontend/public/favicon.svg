<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Dark technical background -->
  <rect width="64" height="64" rx="8" fill="#0a0e12" stroke="#1a2535" stroke-width="1.5" />

  <!-- Outer orbital target ring -->
  <circle cx="32" cy="32" r="22" stroke="#00d9ff" stroke-width="1.5" stroke-dasharray="3 2" stroke-opacity="0.8" />

  <!-- Inner focus ring -->
  <circle cx="32" cy="32" r="14" stroke="#00d9ff" stroke-width="1.75" />

  <!-- Sensor center coordinate reticle -->
  <circle cx="32" cy="32" r="4" fill="#ffb020" />

  <!-- Reticle crosshairs -->
  <line x1="32" y1="4" x2="32" y2="14" stroke="#00d9ff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="50" x2="32" y2="60" stroke="#00d9ff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="4" y1="32" x2="14" y2="32" stroke="#00d9ff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="50" y1="32" x2="60" y2="32" stroke="#00d9ff" stroke-width="1.5" stroke-linecap="round" />

  <!-- Corner tick brackets -->
  <path d="M 8 16 L 8 8 L 16 8" stroke="#00d9ff" stroke-width="1.5" stroke-opacity="0.6" fill="none" />
  <path d="M 56 16 L 56 8 L 48 8" stroke="#00d9ff" stroke-width="1.5" stroke-opacity="0.6" fill="none" />
  <path d="M 8 48 L 8 56 L 16 56" stroke="#00d9ff" stroke-width="1.5" stroke-opacity="0.6" fill="none" />
  <path d="M 56 48 L 56 56 L 48 56" stroke="#00d9ff" stroke-width="1.5" stroke-opacity="0.6" fill="none" />
</svg>
